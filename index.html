<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Hub Pro</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 200px;
    height: 100vh;
    background: #020617;
    position: fixed;
    padding-top: 20px;
    box-shadow: 4px 0 10px rgba(0,0,0,0.5);
}

.sidebar a {
    display: block;
    color: #94a3b8;
    padding: 15px;
    text-decoration: none;
    transition: 0.3s;
}

.sidebar a:hover {
    background: #38bdf8;
    color: black;
    transform: translateX(5px);
}

/* MAIN CONTENT */
.main {
    margin-left: 200px;
    width: 100%;
}

/* SECTIONS */
section {
    padding: 60px 20px;
    text-align: center;
}

/* CARD STYLE */
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    display: inline-block;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px #38bdf8;
}

/* BUTTON */
button {
    padding: 10px 20px;
    border: none;
    background: linear-gradient(45deg, #38bdf8, #0ea5e9);
    color: black;
    cursor: pointer;
    margin: 5px;
    border-radius: 8px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 10px #38bdf8;
}

/* GAME */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 5px;
    justify-content: center;
}

.cell {
    width: 80px;
    height: 80px;
    background: #334155;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s;
}

.cell:hover {
    background: #38bdf8;
    color: black;
}

/* MEME */
.meme-container {
    position: relative;
    display: inline-block;
}

.meme-container img {
    width: 300px;
    border-radius: 10px;
}

.meme-text {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-weight: bold;
    font-size: 20px;
    text-align: center;
    width: 90%;
    text-shadow: 2px 2px 5px black;
}

.top-text { top: 10px; }
.bottom-text { bottom: 10px; }

/* INPUT */
input {
    padding: 8px;
    border-radius: 5px;
    border: none;
    margin: 5px;
}

/* FOOTER */
footer {
    padding: 20px;
    background: #020617;
    text-align: center;
    margin-top: 40px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <a href="#home">🏠 Home</a>
    <a href="#game">🎮 Game</a>
    <a href="#meme">😂 Meme</a>
    <a href="#quiz">🧠 Quiz</a>
    <a href="#joke">🔮 Joke</a>
</div>

<div class="main">

<section id="home">
<h1>🔥 Fun Hub Pro</h1>
<p>Next Level Interactive Website</p>
</section>

<!-- GAME -->
<section id="game">
<div class="card">
<h2>🎮 Tic Tac Toe</h2>
<div class="grid" id="grid"></div>
<p id="status"></p>
<button onclick="resetGame()">Restart</button>
</div>
</section>

<!-- MEME -->
<section id="meme">
<div class="card">
<h2>😂 Meme Generator</h2>

<input type="text" id="topText" placeholder="Top Text"><br>
<input type="text" id="bottomText" placeholder="Bottom Text"><br>
<input type="color" id="textColor" value="#ffffff"><br>

<button onclick="generateMeme()">Generate</button>

<br><br>

<div class="meme-container">
<img src="https://i.imgflip.com/30b1gx.jpg">
<div id="topOutput" class="meme-text top-text"></div>
<div id="bottomOutput" class="meme-text bottom-text"></div>
</div>
</div>
</section>

<!-- QUIZ -->
<section id="quiz">
<div class="card">
<h2>🧠 Quiz</h2>
<p>Which language is used for web?</p>
<button onclick="checkQuiz('Python')">Python</button>
<button onclick="checkQuiz('JavaScript')">JavaScript</button>
<button onclick="checkQuiz('C++')">C++</button>
<p id="quizResult"></p>
</div>
</section>

<!-- JOKE -->
<section id="joke">
<div class="card">
<h2>🔮 Random Joke</h2>
<button onclick="getJoke()">Get Joke</button>
<p id="jokeText"></p>
</div>
</section>

<footer>
<p>Made by RC 🚀 | Advanced UI</p>
</footer>

</div>

<script>
let grid = document.getElementById("grid");
let cells = [];
let current = "X";
let gameActive = true;

for (let i = 0; i < 9; i++) {
    let cell = document.createElement("div");
    cell.className = "cell";
    cell.onclick = () => move(cell);
    grid.appendChild(cell);
    cells.push(cell);
}

function move(cell) {
    if (cell.innerText === "" && gameActive) {
        cell.innerText = current;

        if (checkWinner()) {
            document.getElementById("status").innerText = `🏆 Winner: ${current}`;
            gameActive = false;
            return;
        }

        if (cells.every(c => c.innerText !== "")) {
            document.getElementById("status").innerText = "🤝 Tie!";
            gameActive = false;
            return;
        }

        current = current === "X" ? "O" : "X";
    }
}

function checkWinner() {
    let p = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];
    return p.some(a =>
        cells[a[0]].innerText === current &&
        cells[a[1]].innerText === current &&
        cells[a[2]].innerText === current
    );
}

function resetGame() {
    cells.forEach(c => c.innerText = "");
    current = "X";
    gameActive = true;
    document.getElementById("status").innerText = "";
}

function generateMeme() {
    let color = document.getElementById("textColor").value;

    document.getElementById("topOutput").innerText =
        document.getElementById("topText").value;
    document.getElementById("bottomOutput").innerText =
        document.getElementById("bottomText").value;

    document.getElementById("topOutput").style.color = color;
    document.getElementById("bottomOutput").style.color = color;
}

function checkQuiz(answer) {
    document.getElementById("quizResult").innerText =
        answer === "JavaScript" ? "✅ Correct!" : "❌ Try Again!";
}

function getJoke() {
    let jokes = [
        "Why do programmers hate nature? Too many bugs!",
        "Why JavaScript? Because Java was taken 😅",
        "Debugging: Removing bugs... coding: adding bugs"
    ];
    document.getElementById("jokeText").innerText =
        jokes[Math.floor(Math.random() * jokes.length)];
}
</script>

</body>
</html>
